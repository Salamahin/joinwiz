name: scala-steward

# Opens PRs bumping sbt library + plugin versions (the sbt side Dependabot can't do).
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  scala-steward:
    runs-on: ubuntu-latest
    steps:
      - name: Launch Scala Steward
        uses: scala-steward-org/scala-steward-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
