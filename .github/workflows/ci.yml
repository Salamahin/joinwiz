name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
          cache: sbt

      - name: Set up sbt
        uses: coursier/setup-action@v1
        with:
          apps: sbt

      - name: Check formatting
        run: sbt -Dspark.version=4 scalafmtCheckAll scalafmtSbtCheck

  test:
    name: Test Spark ${{ matrix.spark }} (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - spark: "2"
            java: "8"
          - spark: "3"
            java: "11"
          - spark: "4"
            java: "17"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: sbt

      - name: Set up sbt
        uses: coursier/setup-action@v1
        with:
          apps: sbt

      - name: Run tests
        run: sbt -Dspark.version=${{ matrix.spark }} +test

  binary-compatibility:
    name: Binary compatibility (MiMa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
          cache: sbt

      - name: Set up sbt
        uses: coursier/setup-action@v1
        with:
          apps: sbt

      # Informational until a released baseline exists; then drop continue-on-error to enforce.
      - name: Report binary issues
        continue-on-error: true
        run: sbt -Dspark.version=4 mimaReportBinaryIssues
